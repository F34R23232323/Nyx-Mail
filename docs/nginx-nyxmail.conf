# NyxMail reverse-proxy sample (nginx 1.24+)
# Replace mail.example.com and certificate paths, then run `nginx -t`.
#
# NyxMail already sets CSP, HSTS, X-Frame-Options and Permissions-Policy from
# Next middleware. nginx adds TLS termination, compression and SSE/buffer rules.

upstream nyxmail_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;

    # SSE must stream without proxy buffering.
    location = /api/v1/events {
        proxy_pass http://nyxmail_web;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 12m;
        proxy_set_header X-Accel-Buffering no;
        add_header X-Accel-Buffering no;
    }

    # Large encrypted uploads; Next streams this route.
    location = /api/v1/attachments {
        proxy_pass http://nyxmail_web;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /_next/static/ {
        proxy_pass http://nyxmail_web;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nyxmail_web;
        proxy_buffering on;
    }
}
