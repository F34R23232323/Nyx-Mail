# Per-mailbox Bayes classifier.
#
# Learning is driven by explicit user actions ("Report spam" / "Not spam"),
# which send a reconstructed RFC822 sample to /learnspam or /learnham. Keep
# min_learns low enough that a fresh mailbox starts benefiting quickly.
per_user = true;
min_learns = 20;

# Local persistent SQLite backend (no Redis dependency).
backend = "sqlite";
statfile {
  symbol = "BAYES_HAM";
  path = "/var/lib/rspamd/bayes.ham.sqlite";
  spam = false;
}
statfile {
  symbol = "BAYES_SPAM";
  path = "/var/lib/rspamd/bayes.spam.sqlite";
  spam = true;
}
